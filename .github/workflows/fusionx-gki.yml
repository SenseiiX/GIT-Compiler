name: FusionX Kernel GKI

on:
  workflow_dispatch:
    inputs:
      KERNEL_TREE:
        description: 'Kernel Repository'
        default: 'https://github.com/SenseiiX/fusionX_kernel_gki'
        required: true
      KERNEL_TREE_BRANCH:
        description: 'Kernel Branch'
        required: true
        default: '6.6.89-fusionx'
        type: choice
        options:
          - '6.6.89-fusionx'
          - '6.6.56-fusionx'
      CUSTOM_LOCALVERSION:
        description: 'Custom Kernel Version'
        default: '-FusionX-v1.0-Jinwoo-GKI6.6-SenXLab'
        required: false
      CUSTOM_ZIP_NAME:
        description: 'Custom ZIP Name'
        default: '[FusionX]-KSUNEXT-GKI-1.0'
        required: false
      RELEASE_REPO:
        description: 'Release Repository'
        default: 'SenseiiX/FusionX_Kernel_Releases'
        required: false
      clang_version:
        description: 'Clang Version'
        required: true
        default: 'aosp-18'
        type: choice
        options:
          - 'aosp-18'
          - 'aosp-22'
          - 'zyc-23'
      UPLOAD_TO_RELEASE:
        description: 'Upload to release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v4

    - name: Display Build Configuration
      run: |
        echo "::group::Build Configuration"
        echo "Kernel Tree: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}"
        echo "Kernel Branch: ${{ github.event.inputs.KERNEL_TREE_BRANCH }}"
        echo "Custom Kernel Version: ${{ github.event.inputs.CUSTOM_LOCALVERSION }}"
        echo "Custom ZIP Name: ${{ github.event.inputs.CUSTOM_ZIP_NAME }}"
        echo "Release Repository: ${{ github.event.inputs.RELEASE_REPO }}"
        
        case "${{ github.event.inputs.clang_version }}" in
          aosp-18) echo "Clang Version: AOSP Clang 18 (r510928)" ;;
          aosp-22) echo "Clang Version: AOSP Clang 22.1 (r584948b)" ;;
          zyc-23) echo "Clang Version: Zyc Clang 23.0.0git (20260129)" ;;
        esac
        
        echo "Upload to Release: ${{ github.event.inputs.UPLOAD_TO_RELEASE }}"
        echo "::endgroup::"

    - name: Generate Build Date
      id: build_date
      run: |
        build_date=$(date +"%Y%m%d")
        build_time=$(date +"%Y%m%d-%H%M%S")
        echo "build_date=$build_date" >> $GITHUB_OUTPUT
        echo "build_time=$build_time" >> $GITHUB_OUTPUT

    - name: Initialize Workspace
      id: workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Setup Build Environment
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libncurses-dev \
          libelf-dev \
          libudev-dev \
          libpci-dev \
          libiberty-dev \
          autoconf \
          dwarves \
          llvm \
          lld \
          zip \
          unzip \
          curl \
          wget \
          git \
          python3 \
          python3-pip
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}

    - name: Cache Clang Toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ steps.workspace.outputs.workspace-folder }}/clang
        key: clang-${{ github.event.inputs.clang_version }}-v1
        restore-keys: |
          clang-${{ github.event.inputs.clang_version }}-

    - name: Download Clang Toolchain
      if: steps.cache-clang.outputs.cache-hit != 'true'
      id: clang
      run: |
        CLANG_CHOICE="${{ github.event.inputs.clang_version }}"
        
        case "$CLANG_CHOICE" in
          aosp-18)
            echo "Downloading AOSP Clang 18 (r510928)..."
            wget -q --show-progress \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-release/clang-r510928.tar.gz \
              -O clang.tar.gz
            mkdir clang
            tar -xf clang.tar.gz -C clang
            rm -f clang.tar.gz
            ;;
          aosp-22)
            echo "Downloading AOSP Clang 22.1 (r584948b)..."
            wget -q --show-progress \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/42d2c090c14c9c7f4dfd365ae551e2b959dc775c/clang-r584948b.tar.gz \
              -O clang.tar.gz
            mkdir clang
            tar -xf clang.tar.gz -C clang
            rm -f clang.tar.gz
            ;;
          zyc-23)
            echo "Downloading Zyc Clang 23.0.0git (20260129)..."
            wget -q --show-progress \
              https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260129-release/Clang-23.0.0git-20260129.tar.gz \
              -O clang.tar.gz
            mkdir clang
            tar -xf clang.tar.gz -C clang
            rm -f clang.tar.gz
            ;;
        esac
        
        export PATH="$(pwd)/clang/bin:$PATH"
        export KBUILD_COMPILER_STRING="$($(pwd)/clang/bin/clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
        
        echo "clang-folder=$(pwd)/clang" >> $GITHUB_OUTPUT
        echo "KBUILD_COMPILER_STRING=$KBUILD_COMPILER_STRING" >> $GITHUB_OUTPUT
        echo "Clang version: $KBUILD_COMPILER_STRING"
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}

    - name: Set Clang Path (for cached toolchain)
      if: steps.cache-clang.outputs.cache-hit == 'true'
      id: clang-cached
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export KBUILD_COMPILER_STRING="$($(pwd)/clang/bin/clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')"
        
        echo "clang-folder=$(pwd)/clang" >> $GITHUB_OUTPUT
        echo "KBUILD_COMPILER_STRING=$KBUILD_COMPILER_STRING" >> $GITHUB_OUTPUT
        echo "Using cached Clang: $KBUILD_COMPILER_STRING"
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}

    - name: Clone Kernel Source
      id: kernel
      run: |
        git clone --depth=1 ${{ github.event.inputs.KERNEL_TREE }} -b ${{ github.event.inputs.KERNEL_TREE_BRANCH }} kernel_tree
        echo "kernel-folder=$(pwd)/kernel_tree" >> $GITHUB_OUTPUT
      working-directory: ${{ steps.workspace.outputs.workspace-folder }}

    - name: Setup KernelSU Next
      run: |
        echo "Setting up KernelSU Next..."
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable
        
        echo "Adding CONFIG_KSU=y to defconfig..."
        if [ -f "arch/arm64/configs/fusionx_defconfig" ]; then
          echo "CONFIG_KSU=y" >> arch/arm64/configs/fusionx_defconfig
          echo "CONFIG_KSU=y added to fusionx_defconfig"
        fi
      working-directory: ${{ steps.kernel.outputs.kernel-folder }}

    - name: Change Local Version
      run: |
        echo "Changing LOCALVERSION to: ${{ github.event.inputs.CUSTOM_LOCALVERSION }}"
        if [ -f "arch/arm64/configs/fusionx_defconfig" ]; then
          sed -i '/CONFIG_LOCALVERSION/d' arch/arm64/configs/fusionx_defconfig
          echo 'CONFIG_LOCALVERSION="${{ github.event.inputs.CUSTOM_LOCALVERSION }}"' >> arch/arm64/configs/fusionx_defconfig
          echo "Updated LOCALVERSION to ${{ github.event.inputs.CUSTOM_LOCALVERSION }} in fusionx_defconfig"
        fi
      working-directory: ${{ steps.kernel.outputs.kernel-folder }}

    - name: Build Kernel Configuration
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="senx"
        export KBUILD_BUILD_HOST="ubuntu"
        export PATH="${{ steps.clang.outputs.clang-folder || steps.clang-cached.outputs.clang-folder }}/bin:$PATH"
        
        make O=out \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-w" \
          fusionx_defconfig
      working-directory: ${{ steps.kernel.outputs.kernel-folder }}

    - name: Build Kernel
      id: build
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER="senx"
        export KBUILD_BUILD_HOST="ubuntu"
        export PATH="${{ steps.clang.outputs.clang-folder || steps.clang-cached.outputs.clang-folder }}/bin:$PATH"
        
        make -j17 \
          O=out \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-w"
        
        echo "elapsed_time=$(echo "$(date +%s)"-"${{ steps.workspace.outputs.start_time }}" | bc)" >> $GITHUB_OUTPUT
      working-directory: ${{ steps.kernel.outputs.kernel-folder }}

    - name: Prepare AnyKernel3
      id: anykernel
      run: |
        echo "Cleaning up old kernel zip files..."
        find . -maxdepth 1 -type f -name "${{ github.event.inputs.CUSTOM_ZIP_NAME }}-*.zip" -exec rm -v {} \; || true
        
        if [ -d "anykernel" ]; then
          cp -r anykernel anykernel_temp
        else
          echo "Error: anykernel directory not found!"
          exit 1
        fi
        
        cd anykernel_temp
        
        if [ -f "../out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp -v ../out/arch/arm64/boot/Image.gz-dtb ./
        elif [ -f "../out/arch/arm64/boot/Image.gz" ]; then
          cp -v ../out/arch/arm64/boot/Image.gz ./
        elif [ -f "../out/arch/arm64/boot/Image" ]; then
          cp -v ../out/arch/arm64/boot/Image ./
        else
          echo "Error: No kernel image found!"
          exit 1
        fi
        
        ZIP_NAME="${{ github.event.inputs.CUSTOM_ZIP_NAME }}-${{ steps.build_date.outputs.build_time }}.zip"
        zip -r9 ../$ZIP_NAME ./*
        cd ..
        rm -rf anykernel_temp
        
        echo "zipname=$ZIP_NAME" >> $GITHUB_OUTPUT
        
        BUILD_END=$(date +"%s")
        DIFF=$((BUILD_END - ${{ steps.workspace.outputs.start_time }}))
        
        echo ""
        echo "=========================================="
        echo "Build completed in $((DIFF / 60))m $((DIFF % 60))s"
        echo "Final zip: $ZIP_NAME"
        echo "Zip size: $(du -h "$ZIP_NAME" | cut -f1)"
        echo "=========================================="
      working-directory: ${{ steps.kernel.outputs.kernel-folder }}

    - name: Upload to Release
      if: github.event.inputs.UPLOAD_TO_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.kernel.outputs.kernel-folder }}/${{ steps.anykernel.outputs.zipname }}
        name: FusionX-${{ steps.build_date.outputs.build_date }}
        tag_name: FusionX-${{ steps.build_date.outputs.build_date }}
        body: |
          ## FusionX AOSP GKI Kernel with KernelSU Next ✅
          
          **Build Information:**
          - **Compiler**: ${{ steps.clang.outputs.KBUILD_COMPILER_STRING || steps.clang-cached.outputs.KBUILD_COMPILER_STRING }}
          - **Kernel Branch**: ${{ github.event.inputs.KERNEL_TREE_BRANCH }}
          - **Build Date**: ${{ steps.build_date.outputs.build_time }}
          - **Build Time**: ${{ steps.build.outputs.elapsed_time }} seconds
          - **Kernel Tree**: ${{ github.event.inputs.KERNEL_TREE }}/tree/${{ github.event.inputs.KERNEL_TREE_BRANCH }}
          
          **Installation:**
          1. Download the zip file
          2. Reboot to recovery
          3. Flash the zip
          4. Reboot and enjoy!
          
          **Action**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        token: ${{ secrets.RELEASE_PAT }}
        repository: ${{ github.event.inputs.RELEASE_REPO }}
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

    - name: Upload Kernel Zip as Artifact
      if: github.event.inputs.UPLOAD_TO_RELEASE != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.anykernel.outputs.zipname }}
        path: ${{ steps.kernel.outputs.kernel-folder }}/${{ steps.anykernel.outputs.zipname }}
        retention-days: 30

    - name: Send Telegram Notification
      if: success()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        CLANG_VERSION: ${{ github.event.inputs.clang_version }}
        CUSTOM_LOCALVERSION: ${{ github.event.inputs.CUSTOM_LOCALVERSION }}
        KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_TREE_BRANCH }}
        BUILD_TIME: ${{ steps.build.outputs.elapsed_time }}
        ZIP_FILE_PATH: ${{ steps.kernel.outputs.kernel-folder }}/${{ steps.anykernel.outputs.zipname }}
        BUILD_DATE: ${{ steps.build_date.outputs.build_time }}
      run: |
        cat > send_telegram.py << 'EOF'
        import os
        import requests
        import textwrap
        from datetime import datetime, timezone, timedelta

        def send_telegram_file(bot_token, chat_id, message, file_path):
            url = f"https://api.telegram.org/bot{bot_token}/sendDocument"
            with open(file_path, 'rb') as f:
                files = {'document': f}
                data = {
                    'chat_id': chat_id,
                    'caption': message,
                    'parse_mode': 'HTML'
                }
                response = requests.post(url, data=data, files=files)
            return response.json()

        def send_telegram_message(bot_token, chat_id, message):
            url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
            data = {
                'chat_id': chat_id,
                'text': message,
                'parse_mode': 'HTML'
            }
            return requests.post(url, data=data).json()

        bot_token = os.environ.get('TELEGRAM_BOT_TOKEN')
        chat_id = os.environ.get('TELEGRAM_CHAT_ID')
        clang_version = os.environ.get('CLANG_VERSION', 'aosp-18')
        kernel_branch = os.environ.get('KERNEL_BRANCH', 'unknown')
        build_time = os.environ.get('BUILD_TIME', 'unknown')
        zip_file_path = os.environ.get('ZIP_FILE_PATH')
        build_date = os.environ.get('BUILD_DATE')

        clang_names = {
            'aosp-18': 'AOSP Clang 18 (r510928)',
            'aosp-22': 'AOSP Clang 22.1 (r584948b)',
            'zyc-23': 'Zyc Clang 23.0.0git (20260129)'
        }
        clang_name = clang_names.get(clang_version, 'Unknown')

        manila_tz = timezone(timedelta(hours=8))
        current_time = datetime.now(manila_tz).strftime('%Y-%m-%d %H:%M:%S')

        if not bot_token or not chat_id:
            print("⚠️ Telegram credentials not configured, skipping notification")
            exit(0)

        if not os.path.exists(zip_file_path):
            send_telegram_message(bot_token, chat_id, "❌ <b>Build Failed - ZIP not found!</b>")
            exit(1)

        try:
            total_seconds = int(build_time)
            minutes = total_seconds // 60
            seconds = total_seconds % 60
            build_time_formatted = f"{minutes}m {seconds}s"
        except:
            build_time_formatted = build_time

        caption = textwrap.dedent(f"""\
            <pre>
            <b>FusionX Kernel Build Complete!</b>
            =====================================
            <b>Date:</b>        {current_time}
            <b>Branch:</b>      {kernel_branch}
            <b>Clang:</b>       {clang_name}
            <b>Build Time:</b>  {build_time_formatted}
            =====================================
            </pre>""")

        try:
            result = send_telegram_file(bot_token, chat_id, caption, zip_file_path)
            if result.get('ok'):
                print(f"Successfully sent FusionX Kernel to Telegram")
            else:
                print(f"Failed to send: {result}")
        except Exception as e:
            print(f"Error sending to Telegram: {str(e)}")
        EOF
        
        python3 send_telegram.py

    - name: Cleanup
      if: always()
      run: |
        echo "Build workflow completed!"